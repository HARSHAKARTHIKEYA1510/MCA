<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="100%" height="100%">
  <defs>
    <linearGradient id="cpuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3c72" />
      <stop offset="100%" stop-color="#2a5298" />
    </linearGradient>
    <linearGradient id="ctrlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2027" />
      <stop offset="50%" stop-color="#203a43" />
      <stop offset="100%" stop-color="#2c5364" />
    </linearGradient>
    <linearGradient id="memGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#373b44" />
      <stop offset="100%" stop-color="#4286f4" />
    </linearGradient>
    <linearGradient id="sramGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#134e5e" />
      <stop offset="100%" stop-color="#71b280" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="3" dy="3" stdDeviation="3" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="560" fill="#f8fafc" rx="12" />

  <!-- Title -->
  <text x="450" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">
    Phase II: Enhanced Direct-Mapped Cache Controller Architecture
  </text>
  <text x="450" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">
    Configurable Write-Back/Write-Through Policy | Single-Cycle Hit Path | Hardware PMU
  </text>

  <!-- CPU Subsystem -->
  <g transform="translate(40, 100)">
    <rect width="180" height="380" rx="10" fill="url(#cpuGrad)" filter="url(#shadow)" />
    <text x="90" y="40" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">CPU Core</text>
    <text x="90" y="65" font-family="sans-serif" font-size="11" fill="#93c5fd" text-anchor="middle">(Host Processor)</text>

    <!-- Signal ports -->
    <rect x="15" y="110" width="150" height="30" rx="5" fill="#ffffff" opacity="0.15" />
    <text x="25" y="130" font-family="monospace" font-size="11" fill="#ffffff">cpu_addr [15:0]</text>

    <rect x="15" y="150" width="150" height="30" rx="5" fill="#ffffff" opacity="0.15" />
    <text x="25" y="170" font-family="monospace" font-size="11" fill="#ffffff">cpu_wdata [7:0]</text>

    <rect x="15" y="190" width="150" height="30" rx="5" fill="#ffffff" opacity="0.15" />
    <text x="25" y="210" font-family="monospace" font-size="11" fill="#ffffff">cpu_rdata [7:0]</text>

    <rect x="15" y="230" width="150" height="30" rx="5" fill="#ffffff" opacity="0.15" />
    <text x="25" y="250" font-family="monospace" font-size="11" fill="#ffffff">cpu_req / cpu_rw</text>

    <rect x="15" y="270" width="150" height="30" rx="5" fill="#ffffff" opacity="0.15" />
    <text x="25" y="290" font-family="monospace" font-size="11" fill="#ffffff">cpu_ready / hit</text>
  </g>

  <!-- Cache Controller & SRAM Block -->
  <g transform="translate(260, 90)">
    <rect width="380" height="400" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)" />
    <rect width="380" height="40" rx="10" fill="url(#ctrlGrad)" />
    <text x="190" y="26" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
      direct_mapped_cache_v2 (Top Level)
    </text>

    <!-- Cache Controller FSM -->
    <rect x="20" y="55" width="340" height="150" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" />
    <text x="35" y="78" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e293b">cache_controller_v2 (FSM &amp; PMU)</text>
    
    <rect x="35" y="90" width="150" height="40" rx="5" fill="#e2e8f0" />
    <text x="45" y="108" font-family="sans-serif" font-size="10" font-weight="bold" fill="#334155">Tag Comparator</text>
    <text x="45" y="122" font-family="monospace" font-size="9" fill="#0284c7">stored_tag == req_tag</text>

    <rect x="195" y="90" width="150" height="40" rx="5" fill="#e2e8f0" />
    <text x="205" y="108" font-family="sans-serif" font-size="10" font-weight="bold" fill="#334155">Policy Selector</text>
    <text x="205" y="122" font-family="monospace" font-size="9" fill="#16a34a">Write-Back / Thru</text>

    <rect x="35" y="140" width="310" height="50" rx="5" fill="#e0f2fe" stroke="#38bdf8" />
    <text x="45" y="158" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0369a1">Hardware PMU Monitoring Counters</text>
    <text x="45" y="176" font-family="monospace" font-size="9" fill="#0c4a6e">perf_read_hits | perf_misses | perf_evictions | perf_cycles</text>

    <!-- Cache Memory Array -->
    <rect x="20" y="220" width="340" height="160" rx="8" fill="url(#sramGrad)" />
    <text x="190" y="245" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">cache_memory_v2 (SRAM Array)</text>
    
    <!-- Table representation of SRAM -->
    <g transform="translate(35, 260)">
      <rect width="310" height="105" rx="5" fill="#ffffff" opacity="0.95" />
      <line x1="0" y1="25" x2="310" y2="25" stroke="#cbd5e1" stroke-width="1.5" />
      <text x="15" y="17" font-family="sans-serif" font-size="10" font-weight="bold" fill="#475569">Line Index</text>
      <text x="80" y="17" font-family="sans-serif" font-size="10" font-weight="bold" fill="#475569">Valid</text>
      <text x="120" y="17" font-family="sans-serif" font-size="10" font-weight="bold" fill="#16a34a">Dirty (WB)</text>
      <text x="180" y="17" font-family="sans-serif" font-size="10" font-weight="bold" fill="#475569">Tag [11:0]</text>
      <text x="245" y="17" font-family="sans-serif" font-size="10" font-weight="bold" fill="#475569">Data Block</text>

      <text x="25" y="42" font-family="monospace" font-size="9" fill="#0f172a">0 (00)</text>
      <text x="90" y="42" font-family="monospace" font-size="9" fill="#0f172a">1</text>
      <text x="135" y="42" font-family="monospace" font-size="9" fill="#16a34a">0</text>
      <text x="185" y="42" font-family="monospace" font-size="9" fill="#0f172a">0x001</text>
      <text x="240" y="42" font-family="monospace" font-size="9" fill="#0f172a">4 Bytes</text>

      <text x="25" y="60" font-family="monospace" font-size="9" fill="#0f172a">1 (01)</text>
      <text x="90" y="60" font-family="monospace" font-size="9" fill="#0f172a">1</text>
      <text x="135" y="60" font-family="monospace" font-size="9" fill="#e11d48">1 (Dirty)</text>
      <text x="185" y="60" font-family="monospace" font-size="9" fill="#0f172a">0x003</text>
      <text x="240" y="60" font-family="monospace" font-size="9" fill="#0f172a">4 Bytes</text>

      <text x="25" y="78" font-family="monospace" font-size="9" fill="#0f172a">2 (10)</text>
      <text x="90" y="78" font-family="monospace" font-size="9" fill="#0f172a">1</text>
      <text x="135" y="78" font-family="monospace" font-size="9" fill="#16a34a">0</text>
      <text x="185" y="78" font-family="monospace" font-size="9" fill="#0f172a">0x002</text>
      <text x="240" y="78" font-family="monospace" font-size="9" fill="#0f172a">4 Bytes</text>

      <text x="25" y="96" font-family="monospace" font-size="9" fill="#0f172a">3 (11)</text>
      <text x="90" y="96" font-family="monospace" font-size="9" fill="#0f172a">0</text>
      <text x="135" y="96" font-family="monospace" font-size="9" fill="#16a34a">0</text>
      <text x="185" y="96" font-family="monospace" font-size="9" fill="#94a3b8">0x000</text>
      <text x="240" y="96" font-family="monospace" font-size="9" fill="#94a3b8">Empty</text>
    </g>
  </g>

  <!-- Main Memory Subsystem -->
  <g transform="translate(680, 100)">
    <rect width="180" height="380" rx="10" fill="url(#memGrad)" filter="url(#shadow)" />
    <text x="90" y="40" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Main Memory</text>
    <text x="90" y="65" font-family="sans-serif" font-size="11" fill="#bfdbfe" text-anchor="middle">(64 KB Physical SRAM)</text>

    <rect x="15" y="110" width="150" height="30" rx="5" fill="#ffffff" opacity="0.15" />
    <text x="25" y="130" font-family="monospace" font-size="11" fill="#ffffff">mem_addr [15:0]</text>

    <rect x="15" y="150" width="150" height="30" rx="5" fill="#ffffff" opacity="0.15" />
    <text x="25" y="170" font-family="monospace" font-size="11" fill="#ffffff">mem_req / mem_rw</text>

    <rect x="15" y="190" width="150" height="30" rx="5" fill="#ffffff" opacity="0.15" />
    <text x="25" y="210" font-family="monospace" font-size="11" fill="#ffffff">rdata_block [31:0]</text>

    <rect x="15" y="230" width="150" height="30" rx="5" fill="#ffffff" opacity="0.15" />
    <text x="25" y="250" font-family="monospace" font-size="11" fill="#ffffff">wdata_block [31:0]</text>

    <rect x="15" y="270" width="150" height="30" rx="5" fill="#ffffff" opacity="0.15" />
    <text x="25" y="290" font-family="monospace" font-size="11" fill="#ffffff">mem_ready (ACK)</text>
  </g>

  <!-- Bus arrows CPU <-> Cache -->
  <path d="M 220 220 L 260 220" stroke="#0284c7" stroke-width="3" marker-end="url(#arrow)" />
  <path d="M 260 270 L 220 270" stroke="#059669" stroke-width="3" />

  <!-- Bus arrows Cache <-> Memory -->
  <path d="M 640 220 L 680 220" stroke="#dc2626" stroke-width="3" />
  <path d="M 680 270 L 640 270" stroke="#4f46e5" stroke-width="3" />

  <!-- Footer Info -->
  <text x="450" y="525" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">
    Designed for MCA Phase II Project Evaluation | Member 1: Architecture &amp; Cache Controller
  </text>
</svg>

