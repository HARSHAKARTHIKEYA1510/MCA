<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="100%" height="100%">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="shadow" x="-3%" y="-5%" width="106%" height="112%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.1" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#F8FAFC" />

  <text x="475" y="32" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#0F172A">
    Direct-Mapped Cache Organization (4 Cache Lines x 4 Bytes / Line)
  </text>
  <text x="475" y="52" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748B">
    SRAM Storage Layout, Valid Flags, 12-Bit Tag Arrays, and Sub-Word Multiplexing
  </text>

  <!-- Cache Array Table -->
  <g transform="translate(50, 75)" filter="url(#shadow)">
    <rect width="850" height="360" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    
    <!-- Table Header -->
    <rect width="850" height="45" rx="10" fill="url(#headerGrad)" />
    <rect y="35" width="850" height="10" fill="url(#headerGrad)" />
    <text x="50" y="28" font-family="sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Line Index [3:2]</text>
    <text x="180" y="28" font-family="sans-serif" font-size="12" font-weight="700" fill="#38BDF8">Valid Bit (1b)</text>
    <text x="300" y="28" font-family="sans-serif" font-size="12" font-weight="700" fill="#818CF8">Stored Tag (12b)</text>
    <text x="470" y="28" font-family="sans-serif" font-size="12" font-weight="700" fill="#34D399">Byte 0 [Offset 00]</text>
    <text x="580" y="28" font-family="sans-serif" font-size="12" font-weight="700" fill="#34D399">Byte 1 [Offset 01]</text>
    <text x="690" y="28" font-family="sans-serif" font-size="12" font-weight="700" fill="#34D399">Byte 2 [Offset 10]</text>
    <text x="800" y="28" font-family="sans-serif" font-size="12" font-weight="700" fill="#34D399">Byte 3 [Offset 11]</text>

    <!-- Line 0 (Index 2'b00) -->
    <rect x="15" y="55" width="820" height="65" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="50" y="92" font-family="monospace" font-size="13" font-weight="700" fill="#0F172A">Line 0 (2'b00)</text>
    <rect x="175" y="70" width="40" height="35" rx="4" fill="#E0F2FE" stroke="#0284C7" />
    <text x="195" y="93" text-anchor="middle" font-family="monospace" font-size="14" font-weight="700" fill="#0284C7">1</text>
    <rect x="260" y="70" width="130" height="35" rx="4" fill="#EEF2FF" stroke="#6366F1" />
    <text x="325" y="93" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#4338CA">12'h001 (0x001)</text>
    <rect x="460" y="70" width="80" height="35" rx="4" fill="#ECFDF5" stroke="#10B981" />
    <text x="500" y="93" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#065F46">8'h10</text>
    <rect x="570" y="70" width="80" height="35" rx="4" fill="#ECFDF5" stroke="#10B981" />
    <text x="610" y="93" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#065F46">8'h11</text>
    <rect x="680" y="70" width="80" height="35" rx="4" fill="#ECFDF5" stroke="#10B981" />
    <text x="720" y="93" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#065F46">8'h12</text>
    <rect x="790" y="70" width="80" height="35" rx="4" fill="#ECFDF5" stroke="#10B981" />
    <text x="830" y="93" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#065F46">8'h13</text>

    <!-- Line 1 (Index 2'b01) - Active benchmark line -->
    <rect x="15" y="128" width="820" height="65" rx="6" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5" />
    <text x="50" y="165" font-family="monospace" font-size="13" font-weight="700" fill="#1D4ED8">Line 1 (2'b01)</text>
    <rect x="175" y="143" width="40" height="35" rx="4" fill="#DBEAFE" stroke="#2563EB" />
    <text x="195" y="166" text-anchor="middle" font-family="monospace" font-size="14" font-weight="700" fill="#1D4ED8">1</text>
    <rect x="260" y="143" width="130" height="35" rx="4" fill="#DBEAFE" stroke="#2563EB" />
    <text x="325" y="166" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#1D4ED8">12'h003 (0x003)</text>
    <rect x="460" y="143" width="80" height="35" rx="4" fill="#FEF3C7" stroke="#D97706" />
    <text x="500" y="166" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#92400E">8'hA0</text>
    <rect x="570" y="143" width="80" height="35" rx="4" fill="#FEF3C7" stroke="#D97706" />
    <text x="610" y="166" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#92400E">8'h55*</text>
    <rect x="680" y="143" width="80" height="35" rx="4" fill="#FEF3C7" stroke="#D97706" />
    <text x="720" y="166" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#92400E">8'hA2</text>
    <rect x="790" y="143" width="80" height="35" rx="4" fill="#FEF3C7" stroke="#D97706" />
    <text x="830" y="166" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#92400E">8'hA3</text>

    <!-- Line 2 (Index 2'b10) -->
    <rect x="15" y="201" width="820" height="65" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="50" y="238" font-family="monospace" font-size="13" font-weight="700" fill="#0F172A">Line 2 (2'b10)</text>
    <rect x="175" y="216" width="40" height="35" rx="4" fill="#E0F2FE" stroke="#0284C7" />
    <text x="195" y="239" text-anchor="middle" font-family="monospace" font-size="14" font-weight="700" fill="#0284C7">1</text>
    <rect x="260" y="216" width="130" height="35" rx="4" fill="#EEF2FF" stroke="#6366F1" />
    <text x="325" y="239" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#4338CA">12'h002 (0x002)</text>
    <rect x="460" y="216" width="80" height="35" rx="4" fill="#ECFDF5" stroke="#10B981" />
    <text x="500" y="239" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#065F46">8'h77*</text>
    <rect x="570" y="216" width="80" height="35" rx="4" fill="#ECFDF5" stroke="#10B981" />
    <text x="610" y="239" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#065F46">8'h29</text>
    <rect x="680" y="216" width="80" height="35" rx="4" fill="#ECFDF5" stroke="#10B981" />
    <text x="720" y="239" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#065F46">8'h2A</text>
    <rect x="790" y="216" width="80" height="35" rx="4" fill="#ECFDF5" stroke="#10B981" />
    <text x="830" y="239" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#065F46">8'h2B</text>

    <!-- Line 3 (Index 2'b11) -->
    <rect x="15" y="274" width="820" height="65" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="50" y="311" font-family="monospace" font-size="13" font-weight="700" fill="#0F172A">Line 3 (2'b11)</text>
    <rect x="175" y="289" width="40" height="35" rx="4" fill="#E0F2FE" stroke="#0284C7" />
    <text x="195" y="312" text-anchor="middle" font-family="monospace" font-size="14" font-weight="700" fill="#0284C7">1</text>
    <rect x="260" y="289" width="130" height="35" rx="4" fill="#EEF2FF" stroke="#6366F1" />
    <text x="325" y="312" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#4338CA">12'h003 (0x003)</text>
    <rect x="460" y="289" width="80" height="35" rx="4" fill="#ECFDF5" stroke="#10B981" />
    <text x="500" y="312" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#065F46">8'h3C</text>
    <rect x="570" y="289" width="80" height="35" rx="4" fill="#ECFDF5" stroke="#10B981" />
    <text x="610" y="312" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#065F46">8'h3D</text>
    <rect x="680" y="289" width="80" height="35" rx="4" fill="#ECFDF5" stroke="#10B981" />
    <text x="720" y="312" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#065F46">8'h3E</text>
    <rect x="790" y="289" width="80" height="35" rx="4" fill="#ECFDF5" stroke="#10B981" />
    <text x="830" y="312" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#065F46">8'h3F</text>

    <!-- Legend footnote -->
    <text x="425" y="352" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#475569">
      * Denotes byte updated via Write-Through / Write-Allocate transaction during simulation testbench.
    </text>
  </g>
</svg>
