<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="100%" height="100%">
  <defs>
    <linearGradient id="cpuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#3730A3" />
    </linearGradient>
    <linearGradient id="cacheGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="memGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1E293B" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284C7" />
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0D9488" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#F8FAFC" />

  <!-- Title -->
  <text x="475" y="35" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0F172A">
    Top-Level System Architecture: CPU, Cache Controller, and Main Memory
  </text>
  <text x="475" y="58" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#64748B">
    16-Bit Byte-Addressable Architecture with Write-Through and Write-Allocate Policy
  </text>

  <!-- CPU Subsystem -->
  <g transform="translate(30, 90)" filter="url(#shadow)">
    <rect width="160" height="340" rx="10" fill="url(#cpuGrad)" />
    <text x="80" y="32" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">CPU Core</text>
    <text x="80" y="52" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#E0E7FF">(Master Master)</text>
    <line x1="20" y1="65" x2="140" y2="65" stroke="#818CF8" stroke-width="1" />

    <rect x="15" y="80" width="130" height="50" rx="6" fill="#4338CA" />
    <text x="80" y="102" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Address Bus</text>
    <text x="80" y="120" text-anchor="middle" font-family="monospace" font-size="11" fill="#C7D2FE">16-bit (cpu_addr)</text>

    <rect x="15" y="145" width="130" height="50" rx="6" fill="#4338CA" />
    <text x="80" y="167" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Data Bus</text>
    <text x="80" y="185" text-anchor="middle" font-family="monospace" font-size="11" fill="#C7D2FE">8-bit (wdata/rdata)</text>

    <rect x="15" y="210" width="130" height="50" rx="6" fill="#4338CA" />
    <text x="80" y="232" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Control Strobe</text>
    <text x="80" y="250" text-anchor="middle" font-family="monospace" font-size="11" fill="#C7D2FE">cpu_req, cpu_rw</text>

    <rect x="15" y="275" width="130" height="50" rx="6" fill="#4338CA" />
    <text x="80" y="297" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Handshake In</text>
    <text x="80" y="315" text-anchor="middle" font-family="monospace" font-size="11" fill="#C7D2FE">cpu_ready, cpu_hit</text>
  </g>

  <!-- Cache Controller & Memory (Top Module direct_mapped_cache) -->
  <g transform="translate(260, 80)" filter="url(#shadow)">
    <rect width="420" height="360" rx="12" fill="#FFFFFF" stroke="#0284C7" stroke-width="2" />
    <rect width="420" height="42" rx="12" fill="url(#cacheGrad)" />
    <rect y="30" width="420" height="12" fill="url(#cacheGrad)" />
    <text x="210" y="26" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">
      direct_mapped_cache (Cache Subsystem)
    </text>

    <!-- cache_controller inner block -->
    <rect x="20" y="55" width="180" height="285" rx="8" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.5" />
    <text x="110" y="78" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0369A1">cache_controller</text>
    <text x="110" y="94" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#0284C7">(6-State FSM Engine)</text>
    <line x1="30" y1="102" x2="190" y2="102" stroke="#BAE6FD" stroke-width="1" />

    <text x="30" y="125" font-family="sans-serif" font-size="10" font-weight="600" fill="#0F172A">• Tag Extractor (12b)</text>
    <text x="30" y="145" font-family="sans-serif" font-size="10" font-weight="600" fill="#0F172A">• Index Slicer (2b)</text>
    <text x="30" y="165" font-family="sans-serif" font-size="10" font-weight="600" fill="#0F172A">• Offset Slicer (2b)</text>
    <text x="30" y="185" font-family="sans-serif" font-size="10" font-weight="600" fill="#0F172A">• Hit/Miss Evaluator</text>
    <text x="30" y="205" font-family="sans-serif" font-size="10" font-weight="600" fill="#0F172A">• Memory Arbiter</text>
    <text x="30" y="225" font-family="sans-serif" font-size="10" font-weight="600" fill="#0F172A">• Write-Through Logic</text>
    <text x="30" y="245" font-family="sans-serif" font-size="10" font-weight="600" fill="#0F172A">• Write-Allocate Logic</text>

    <rect x="30" y="265" width="160" height="60" rx="6" fill="#E0F2FE" />
    <text x="110" y="285" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#0369A1">FSM States:</text>
    <text x="110" y="300" text-anchor="middle" font-family="monospace" font-size="9" fill="#0284C7">IDLE, LOOKUP, MISS,</text>
    <text x="110" y="315" text-anchor="middle" font-family="monospace" font-size="9" fill="#0284C7">ALLOC, WR_THRU, DONE</text>

    <!-- cache_memory inner block -->
    <rect x="220" y="55" width="180" height="285" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" />
    <text x="310" y="78" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#334155">cache_memory</text>
    <text x="310" y="94" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748B">(16-Byte SRAM Core)</text>
    <line x1="230" y1="102" x2="390" y2="102" stroke="#CBD5E1" stroke-width="1" />

    <!-- 4 lines breakdown -->
    <rect x="230" y="112" width="160" height="42" rx="4" fill="#FFFFFF" stroke="#94A3B8" />
    <text x="235" y="128" font-family="monospace" font-size="9" font-weight="700" fill="#0F172A">Line 0 [00]: V=1 Tag(12b)</text>
    <text x="235" y="145" font-family="monospace" font-size="9" fill="#475569">Data: B3 | B2 | B1 | B0</text>

    <rect x="230" y="160" width="160" height="42" rx="4" fill="#FFFFFF" stroke="#94A3B8" />
    <text x="235" y="176" font-family="monospace" font-size="9" font-weight="700" fill="#0F172A">Line 1 [01]: V=1 Tag(12b)</text>
    <text x="235" y="193" font-family="monospace" font-size="9" fill="#475569">Data: B3 | B2 | B1 | B0</text>

    <rect x="230" y="208" width="160" height="42" rx="4" fill="#FFFFFF" stroke="#94A3B8" />
    <text x="235" y="224" font-family="monospace" font-size="9" font-weight="700" fill="#0F172A">Line 2 [10]: V=1 Tag(12b)</text>
    <text x="235" y="241" font-family="monospace" font-size="9" fill="#475569">Data: B3 | B2 | B1 | B0</text>

    <rect x="230" y="256" width="160" height="42" rx="4" fill="#FFFFFF" stroke="#94A3B8" />
    <text x="235" y="272" font-family="monospace" font-size="9" font-weight="700" fill="#0F172A">Line 3 [11]: V=1 Tag(12b)</text>
    <text x="235" y="289" font-family="monospace" font-size="9" fill="#475569">Data: B3 | B2 | B1 | B0</text>

    <text x="310" y="325" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#475569">Total: 4 Lines x 4 Bytes</text>
  </g>

  <!-- Main Memory Subsystem -->
  <g transform="translate(750, 90)" filter="url(#shadow)">
    <rect width="170" height="340" rx="10" fill="url(#memGrad)" />
    <text x="85" y="32" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">main_memory</text>
    <text x="85" y="52" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#CCFBF1">(Secondary Storage)</text>
    <line x1="20" y1="65" x2="150" y2="65" stroke="#2DD4BF" stroke-width="1" />

    <rect x="15" y="80" width="140" height="55" rx="6" fill="#0F766E" />
    <text x="85" y="102" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Byte Storage</text>
    <text x="85" y="122" text-anchor="middle" font-family="monospace" font-size="10" fill="#A7F3D0">64 KB Capacity</text>

    <rect x="15" y="145" width="140" height="55" rx="6" fill="#0F766E" />
    <text x="85" y="167" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Burst Block Read</text>
    <text x="85" y="187" text-anchor="middle" font-family="monospace" font-size="10" fill="#A7F3D0">32-bit (4-byte burst)</text>

    <rect x="15" y="210" width="140" height="55" rx="6" fill="#0F766E" />
    <text x="85" y="232" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Single-Byte Write</text>
    <text x="85" y="252" text-anchor="middle" font-family="monospace" font-size="10" fill="#A7F3D0">Write-Through Port</text>

    <rect x="15" y="275" width="140" height="55" rx="6" fill="#0F766E" />
    <text x="85" y="297" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Access Latency</text>
    <text x="85" y="317" text-anchor="middle" font-family="monospace" font-size="10" fill="#A7F3D0">2 Cycles (mem_ready)</text>
  </g>

  <!-- CPU to Cache Interconnect Arrows -->
  <line x1="190" y1="180" x2="255" y2="180" stroke="#1E293B" stroke-width="2.5" marker-end="url(#arrow)" />
  <text x="225" y="172" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#1E293B">cpu_addr, cpu_req</text>

  <line x1="190" y1="230" x2="255" y2="230" stroke="#4F46E5" stroke-width="2.5" marker-end="url(#arrow)" />
  <text x="225" y="222" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#4F46E5">cpu_wdata [7:0]</text>

  <line x1="255" y1="280" x2="195" y2="280" stroke="#0284C7" stroke-width="2.5" marker-end="url(#arrowBlue)" />
  <text x="225" y="272" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#0284C7">cpu_rdata [7:0]</text>

  <line x1="255" y1="330" x2="195" y2="330" stroke="#0284C7" stroke-width="2.5" marker-end="url(#arrowBlue)" />
  <text x="225" y="322" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#0284C7">cpu_ready, cpu_hit</text>

  <!-- Cache to Main Memory Interconnect Arrows -->
  <line x1="680" y1="180" x2="745" y2="180" stroke="#1E293B" stroke-width="2.5" marker-end="url(#arrow)" />
  <text x="715" y="172" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#1E293B">mem_addr, mem_req</text>

  <line x1="680" y1="230" x2="745" y2="230" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrowTeal)" />
  <text x="715" y="222" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#0F766E">mem_wdata [7:0]</text>

  <line x1="745" y1="280" x2="685" y2="280" stroke="#0D9488" stroke-width="2.5" marker-end="url(#arrowTeal)" />
  <text x="715" y="272" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#0D9488">rdata_block [31:0]</text>

  <line x1="745" y1="330" x2="685" y2="330" stroke="#0D9488" stroke-width="2.5" marker-end="url(#arrowTeal)" />
  <text x="715" y="322" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#0D9488">mem_ready</text>

</svg>
